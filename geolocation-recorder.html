<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geolocation Recorder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e8e8e8;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
    }
    .btn-record {
      min-width: 180px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-record.recording {
      background-color: #dc3545 !important;
      border-color: #dc3545 !important;
      color: #fff !important;
    }
    .btn-record.recording:hover {
      background-color: #bb2d3b !important;
      border-color: #b02a37 !important;
    }
    #status {
      min-height: 1.5rem;
    }
    #output {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }
    .warning-text {
      color: #ffc107;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg rounded-4 p-4">
          <h1 class="h3 text-center mb-2">Geolocation Recorder</h1>
          <p class="text-center text-secondary small mb-4">
            Records your position every second. Data stays in this browser only.
          </p>

          <div class="d-grid gap-2 mb-3">
            <button id="toggleBtn" class="btn btn-primary btn-lg btn-record">
              Start recording
            </button>
          </div>

          <p id="status" class="text-center small mb-3 text-secondary"></p>

          <div id="recordingInfo" class="d-none text-center mb-3">
            <p class="warning-text mb-1">
              Recording your location. This is sensitive data please think before sharing this data.
            </p>
            <p class="small text-secondary mb-0">
              Points recorded: <span id="pointCount">0</span>
            </p>
          </div>

          <div id="exportSection" class="d-none">
            <label for="output" class="form-label small text-secondary">Recorded locations (JSON)</label>
            <textarea id="output" class="form-control mb-2" rows="12" readonly></textarea>
            <div class="d-grid">
              <button id="copyBtn" class="btn btn-outline-light">Copy data</button>
            </div>
            <p id="copyFeedback" class="text-center small mt-2 text-success d-none">Copied to clipboard</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const toggleBtn = document.getElementById('toggleBtn');
      const statusEl = document.getElementById('status');
      const recordingInfo = document.getElementById('recordingInfo');
      const pointCountEl = document.getElementById('pointCount');
      const exportSection = document.getElementById('exportSection');
      const outputEl = document.getElementById('output');
      const copyBtn = document.getElementById('copyBtn');
      const copyFeedback = document.getElementById('copyFeedback');

      let recording = false;
      let locations = [];
      let watchId = null;
      let intervalId = null;
      let wakeLock = null;

      function setStatus(msg, isError) {
        statusEl.textContent = msg || '';
        statusEl.classList.toggle('text-danger', !!isError);
        statusEl.classList.toggle('text-secondary', !isError);
      }

      async function requestWakeLock() {
        if (!('wakeLock' in navigator)) {
          setStatus('Wake Lock not supported; screen may turn off.');
          return;
        }
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            if (recording) {
              // Re-request if still recording (e.g. after tab visibility change)
              requestWakeLock().catch(() => {});
            }
          });
        } catch (err) {
          setStatus('Could not keep screen on: ' + (err.message || err), true);
        }
      }

      function releaseWakeLock() {
        if (wakeLock) {
          wakeLock.release().catch(() => {});
          wakeLock = null;
        }
      }

      function recordPosition(position) {
        const coords = position.coords;
        locations.push({
          latitude: coords.latitude,
          longitude: coords.longitude,
          accuracy: coords.accuracy,
          altitude: coords.altitude,
          altitudeAccuracy: coords.altitudeAccuracy,
          heading: coords.heading,
          speed: coords.speed,
          timestamp: position.timestamp,
          recordedAt: new Date().toISOString()
        });
        pointCountEl.textContent = String(locations.length);
      }

      function onGeoError(err) {
        const messages = {
          1: 'Permission denied. Allow location access to record.',
          2: 'Position unavailable.',
          3: 'Location request timed out.'
        };
        setStatus(messages[err.code] || err.message || 'Geolocation error', true);
      }

      function startRecording() {
        if (!navigator.geolocation) {
          setStatus('Geolocation is not supported by this browser.', true);
          return;
        }

        locations = [];
        recording = true;
        exportSection.classList.add('d-none');
        recordingInfo.classList.remove('d-none');
        pointCountEl.textContent = '0';
        toggleBtn.textContent = 'Stop recording';
        toggleBtn.classList.add('recording');
        setStatus('Requesting location…');

        requestWakeLock();

        // Prefer watchPosition; also poll every second as a fallback for consistent interval
        const options = {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        };

        watchId = navigator.geolocation.watchPosition(recordPosition, onGeoError, options);

        intervalId = setInterval(() => {
          navigator.geolocation.getCurrentPosition(recordPosition, onGeoError, options);
        }, 1000);

        setStatus('Recording…');
      }

      function stopRecording() {
        recording = false;
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        if (intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
        }
        releaseWakeLock();

        toggleBtn.textContent = 'Start recording';
        toggleBtn.classList.remove('recording');
        recordingInfo.classList.add('d-none');
        setStatus(locations.length ? 'Stopped. ' + locations.length + ' point(s) recorded.' : 'Stopped. No points recorded.');

        // Fill readonly box with JSON array (toJSON-style output)
        const json = JSON.stringify(locations, null, 2);
        outputEl.value = json;
        exportSection.classList.remove('d-none');
        copyFeedback.classList.add('d-none');
      }

      toggleBtn.addEventListener('click', () => {
        if (recording) {
          stopRecording();
        } else {
          startRecording();
        }
      });

      copyBtn.addEventListener('click', async () => {
        const text = outputEl.value;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            outputEl.select();
            document.execCommand('copy');
          }
          copyFeedback.classList.remove('d-none');
          setTimeout(() => copyFeedback.classList.add('d-none'), 2000);
        } catch (err) {
          // Fallback: select so user can copy manually
          outputEl.focus();
          outputEl.select();
          setStatus('Select the text and copy manually (Ctrl/Cmd+C).', true);
        }
      });

      // Release wake lock when page is hidden for a long time / unloaded
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && recording && !wakeLock) {
          requestWakeLock().catch(() => {});
        }
      });

      window.addEventListener('beforeunload', () => {
        releaseWakeLock();
      });
    })();
  </script>
</body>
</html>
